<!DOCTYPE html>
<html>
<head>
  <title>Pro Udhar Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>📒 PRO UDHAR BOOK</h1>

<!-- DASHBOARD -->
<div class="dashboard">

<div class="card">
<h3>Customers</h3>
<p id="totalCustomers">0</p>
</div>

<div class="card">
<h3>Pending</h3>
<p id="pending">₹0</p>
</div>

<div class="card">
<h3>Paid</h3>
<p id="paid">0</p>
</div>

</div>

<!-- ADD CUSTOMER -->
<div class="form">

<input id="name" placeholder="Customer Name">
<input id="phone" placeholder="Phone">
<input id="item" placeholder="Item">
<input id="price" type="number" placeholder="Price">

<button onclick="addCustomer()">➕ Add Customer</button>

</div>

<!-- SEARCH -->
<input id="search" onkeyup="search()" placeholder="🔍 Search">

<!-- LIST -->
<div id="list"></div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
