<!DOCTYPE html>
<html>
<head>
  <title>Smart Udhar Book</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- Shop Photo -->
  <img src="shop.jpg" class="shop-logo">

  <h1>📒 Smart Udhar Book</h1>

  <!-- Dashboard -->

  <div class="dashboard">

    <div class="card">
      <h3>Total Customers</h3>
      <p id="totalCustomers">0</p>
    </div>

    <div class="card">
      <h3>Total Pending</h3>
      <p id="pending">₹0</p>
    </div>

  </div>

  <!-- Form -->

  <div class="form">

    <input type="text"
    id="name"
    placeholder="Customer Name">

    <input type="tel"
    id="phone"
    placeholder="Phone Number">

    <input type="text"
    id="item"
    placeholder="Item Name">

    <input type="number"
    id="price"
    placeholder="Price">

    <button onclick="addCustomer()">
      ➕ Add Entry
    </button>

  </div>

  <!-- Search -->

  <input type="text"
  id="search"
  placeholder="🔍 Search Customer"
  onkeyup="searchCustomer()">

  <!-- Customer List -->

  <div id="list"></div>

</div>

<script src="script.js"></script>

</body>
</html>
