<!DOCTYPE html>
<html>
<head>
  <title>Smart Udhar Book</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<img src="shop.jpg" class="shop-logo">

<h1>📒 Smart Udhar Book</h1>

<div class="dashboard">

<div class="card">
<h3>Total Customers</h3>
<p id="totalCustomers">0</p>
</div>

<div class="card">
<h3>Total Pending</h3>
<p id="pending">₹0</p>
</div>

</div>

<!-- ADD CUSTOMER -->

<div class="form">

<input id="name" placeholder="Customer Name">

<input id="phone" placeholder="Phone Number">

<button onclick="addCustomer()">

➕ Add Customer

</button>

</div>

<!-- SEARCH -->

<input id="search"
placeholder="🔍 Search Customer"
onkeyup="searchCustomer()">

<!-- CUSTOMER LIST -->

<div id="list"></div>

</div>

<script src="script.js"></script>

</body>
</html>
