<!DOCTYPE html>
<html>
<head>
  <title>Pro Udhar Book</title>

  <!-- CSS LINK (IMPORTANT) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- SHOP PHOTO -->
  <img src="shop.jpg" class="shop-logo" alt="Shop Logo">

  <h1>📒 Pro Udhar Book</h1>

  <!-- DASHBOARD -->
  <div class="dashboard">

    <div class="card">
      <h3>Total Customers</h3>
      <p id="totalCustomers">0</p>
    </div>

    <div class="card">
      <h3>Pending</h3>
      <p id="pending">₹0</p>
    </div>

    <div class="card">
      <h3>Paid</h3>
      <p id="paid">0</p>
    </div>

  </div>

  <!-- FORM -->
  <div class="form">

    <input id="name" placeholder="Customer Name">
    <input id="phone" placeholder="Phone Number">
    <input id="item" placeholder="Item">
    <input id="price" type="number" placeholder="Price">

    <button onclick="addCustomer()">➕ Add Customer</button>

  </div>

  <input id="search" placeholder="🔍 Search" onkeyup="searchCustomer()">

  <div id="list"></div>

</div>

<script src="script.js"></script>

</body>
</html>
